services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: catalogo
      POSTGRES_USER: catalogo
      POSTGRES_PASSWORD: catalogo
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/catalogo
      DB_USER: catalogo
      DB_PASS: catalogo
    depends_on:
      - db
